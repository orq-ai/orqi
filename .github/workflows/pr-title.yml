name: PR title

# Squash merge uses COMMIT_OR_PR_TITLE, so the PR title becomes the squash
# commit subject on main, which release.yml turns into the version bump and the
# release notes. A non-conventional title silently ships no release and no
# changelog line, so it is rejected here rather than at release time.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Check the PR title is a Conventional Commits subject
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: bun scripts/check-pr-title.ts "$TITLE"

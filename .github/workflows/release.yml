name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # The binary users download is whatever this compiles, so the compiler
          # is pinned and bumped deliberately.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The tag is the version users see: src/branding.ts reads it from
      # package.json, and nothing else reconciles the two.
      - name: Check the tag matches package.json
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          [ "$GITHUB_REF_NAME" = "v$version" ] || {
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          }

      - run: bun test

      # bun build --compile does not type-check, so without this a tag can ship
      # code that does not compile under tsc.
      - run: bun run typecheck

      - run: bun run dist

      # Proves one of the three tarballs actually runs. --version needs no
      # credentials and no network, so it exercises the real startup path.
      - name: Smoke test the linux binary
        run: |
          mkdir -p /tmp/smoke
          tar -xzf dist/orqi-linux-x64.tar.gz -C /tmp/smoke
          [ "$(/tmp/smoke/orqi --version)" = "$(bun -e 'console.log(require("./package.json").version)')" ]

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Re-running the job for a tag that already has a release replaces the
        # assets instead of failing with "release already exists".
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --generate-notes --verify-tag \
            || gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber

  # npm comes after the GitHub release and packs its tarballs, so the three
  # platform packages carry the same bytes install.sh downloads. npm versions
  # cannot be republished, so the packed files are installed on every supported
  # platform before anything reaches the registry, and publish-npm uploads
  # exactly those files. Prerelease tags stop here: stage.mjs only takes x.y.z
  # and nothing sets an npm dist-tag other than latest.
  stage-npm:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Stage and pack the npm packages from the release tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" -p 'orqi-*.tar.gz' --dir /tmp/tarballs
          node npm/stage.mjs "${GITHUB_REF_NAME#v}" /tmp/tarballs /tmp/npm
          mkdir -p dist/packs
          for pkg in /tmp/npm/*/; do
            npm pack "$pkg" --pack-destination dist/packs
          done

      - uses: actions/upload-artifact@v4
        with:
          name: npm-packs
          path: dist/packs
          if-no-files-found: error

  test-npm:
    needs: stage-npm
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packs
          path: packs

      # The other platforms' packages are not on npm yet; npm skips the
      # optional dependencies it cannot fetch, which is the point.
      - name: Install the packed files and check the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          platform=$(node -p 'process.platform + "-" + process.arch')
          npm install -g "./packs/orq-ai-orqi-$platform-$version.tgz" "./packs/orq-ai-orqi-$version.tgz"
          [ "$(orqi --version)" = "$version" ]

  # Trusted publishing checks the workflow file the job runs in, so this stays
  # in release.yml; a workflow_dispatch retry from another file would be
  # refused. A failed publish is retried with "Re-run failed jobs", and
  # versions already on npm are skipped. Never re-run the release job once npm
  # has a version: it would rebuild tarballs that no longer match npm's bytes.
  publish-npm:
    needs: test-npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      # Trusted publishing needs npm 11.5.1 or later, which ships with Node
      # 24.5 and up; check-latest keeps a cached older 24.x off the runner.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          check-latest: true

      - uses: actions/download-artifact@v4
        with:
          name: npm-packs
          path: packs

      # The wrapper goes last: its optionalDependencies must already exist.
      - name: Publish packages that are not on npm yet
        run: |
          version="${GITHUB_REF_NAME#v}"
          publish_if_missing() {
            name=$(tar -xzOf "$1" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published; skipping"
              return
            fi
            npm publish "$1" --access public
          }
          for pack in ./packs/orq-ai-orqi-*-"$version".tgz; do
            publish_if_missing "$pack"
          done
          publish_if_missing "./packs/orq-ai-orqi-$version.tgz"

  # Installs from the registry the way a user would, on each supported
  # platform. The registry can lag a publish by a little, hence the retries.
  verify-npm:
    needs: publish-npm
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions: {}
    steps:
      - name: npm i -g @orq-ai/orqi and check the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in 1 2 3 4 5; do
            if npm install -g "@orq-ai/orqi@$version" && [ "$(orqi --version)" = "$version" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "npm i -g @orq-ai/orqi@$version did not give an orqi printing $version" >&2
          exit 1

name: Release

# Releases are created only from main. The workflow writes the version commit
# and its tag itself, so a stale feature branch cannot publish a release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize resolution, the version commit, and publication. Do not cancel a
# run: a later merge must be released after the earlier one, not instead of it.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # A retry after a failed publish resumes the tag already at main's tip.
      # Otherwise resolve only commits since the last release tag reachable from
      # main. docs/test/ci/chore commits produce no release; fix/perf/revert,
      # feat, and breaking conventional commits respectively bump patch, minor,
      # and major.
      - name: Resolve and tag the next release from main
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "Orq GitHub Actions"
          git config user.email "admin@orq.ai"
          head="$(git rev-parse HEAD)"
          existing="$(git tag --points-at "$head" --list 'v[0-9]*' | head -1 || true)"
          if [ -n "$existing" ]; then
            echo "resuming $existing at main's tip"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            echo "error: main has no stable release tag to use as a version base" >&2
            exit 1
          fi
          version="$(git log -z --format='%s%n%b' "$previous..HEAD" | bun scripts/release-version.ts --base "${previous#v}")"
          if [ -z "$version" ]; then
            echo "no releasable conventional commits since $previous"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "error: $tag already exists" >&2
            exit 1
          fi

          # package.json is the one version source compiled into the binary.
          bun -e 'const p = await Bun.file("package.json").json(); p.version = process.argv[1]; await Bun.write("package.json", JSON.stringify(p, null, "\t") + "\n")' "$version"
          git add package.json
          git commit -m "chore(release): $version"
          git tag -a "$tag" -m "Release $tag"
          # Atomic push prevents a version commit without its matching tag. A
          # concurrent merge rejects this push; that merge starts the next
          # serialized run, which resolves the combined range afresh.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      # "true" when the tag's release was already published with every asset:
      # nothing here is rebuilt or re-uploaded.
      published: ${{ steps.existing.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          # git-cliff walks back to the previous tag for the release notes.
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The binary users download is whatever this compiles, so the compiler
          # is pinned and bumped deliberately.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The tag is the version users see: src/branding.ts reads it from
      # package.json, and nothing else reconciles the two.
      - name: Check the tag matches package.json
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          [ "$TAG" = "v$version" ] || {
            echo "tag $TAG does not match package.json version $version" >&2
            exit 1
          }

      # A published release is never modified: if every asset is there this
      # run has nothing to upload, and if one is
      # missing it fails rather than replacing files users may already hold. A
      # draft is what a failed earlier run leaves behind, and is safe to redo.
      - name: Look for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Unset means "not published": the steps below test != 'true'.
          if ! json=$(gh release view "$TAG" --json isDraft,assets 2>/dev/null); then
            exit 0
          fi
          if [ "$(jq -r .isDraft <<<"$json")" = true ]; then
            gh release delete "$TAG" --yes
            exit 0
          fi
          for asset in orqi-macos-arm64.tar.gz orqi-macos-x64.tar.gz orqi-linux-x64.tar.gz orqi-linux-arm64.tar.gz orqi-win32-x64.tar.gz; do
            for name in "$asset" "$asset.sha256"; do
              jq -e --arg n "$name" '.assets[] | select(.name == $n and .size > 0)' <<<"$json" >/dev/null || {
                echo "::error::release $TAG is published but $name is missing; delete the release to rebuild it" >&2
                exit 1
              }
            done
          done
          echo "release $TAG is already published with every asset; nothing to upload"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - run: bun test
        if: steps.existing.outputs.published != 'true'

      # bun build --compile does not type-check, so without this a tag can ship
      # code that does not compile under tsc.
      - run: bun run typecheck
        if: steps.existing.outputs.published != 'true'

      - run: bun run dist
        if: steps.existing.outputs.published != 'true'

      # Proves one of the three tarballs actually runs, and that its sidecar
      # matches it. --version needs no credentials and no network, so it
      # exercises the real startup path.
      - name: Smoke test the linux binary and its checksum
        if: steps.existing.outputs.published != 'true'
        run: |
          (cd dist && sha256sum -c orqi-linux-x64.tar.gz.sha256)
          mkdir -p /tmp/smoke
          tar -xzf dist/orqi-linux-x64.tar.gz -C /tmp/smoke
          [ "$(/tmp/smoke/orqi --version)" = "$(bun -e 'console.log(require("./package.json").version)')" ]

      # Build provenance: `gh attestation verify orqi-linux-x64.tar.gz -R orq-ai/orqi`
      # proves which run of this workflow built a tarball someone is holding.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.existing.outputs.published != 'true'
        with:
          subject-path: dist/*.tar.gz

      # Notes come from the conventional commits since the previous tag
      # (cliff.toml), not from PR titles, so commits pushed straight to main
      # are listed too.
      - name: Generate the release notes
        if: steps.existing.outputs.published != 'true'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      # Draft first: a draft is not returned by releases/latest, so install.sh
      # cannot resolve "latest" to a release whose assets are still uploading.
      # A tag with a "-" is a prerelease, which releases/latest also skips.
      - name: Create the release as a draft and upload the assets
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags="--draft --verify-tag --notes-file RELEASE_NOTES.md"
          case "$TAG" in *-*) flags="$flags --prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$TAG" $flags dist/*.tar.gz dist/*.tar.gz.sha256

      - name: Publish the release
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --draft=false

# Keeps the SHA-pinned actions in .github/workflows and the root bun dependencies
# current. The PR title prefixes match the repo's commit style.
#
# Covered on purpose by the `bun` ecosystem, not `npm`: CI and release run
# `bun install --frozen-lockfile`, so a bump that does not regenerate bun.lock
# fails the build.
#
# Not covered, on purpose:
# - skills/**/requirements.txt is vendored from orq-ai/assistant-plugins by
#   `bun run vendor`; a test fails when the tree and skills.lock.json disagree.
# - npm/orqi/package.json has no dependencies; its optionalDependencies are
#   stamped at release by npm/stage.mjs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

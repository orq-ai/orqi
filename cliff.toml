# Release notes for each tag, generated by git-cliff from the conventional
# commits since the previous tag. release.yml renders the latest section into
# the GitHub Release body. Preview locally with `git cliff --unreleased`.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^docs", group = "<!-- 2 -->Documentation" },
  { message = "^(ci|build)", group = "<!-- 3 -->CI and release" },
  { message = "^(refactor|perf|test)", group = "<!-- 4 -->Other" },
  { message = ".*", skip = true },
]

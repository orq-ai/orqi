  <title>orqi, aka TonyBot: the orq.ai helper agent in your terminal</title>
  <defs>
    <!-- Phosphor bloom: a CRT halo, not a gradient wash -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Scanlines: one dark line every third pixel row -->
    <pattern id="scan" width="1280" height="3" patternUnits="userSpaceOnUse">
      <rect width="1280" height="1" y="0" fill="#000000" opacity="0.34"/>
    </pattern>
  </defs>

